skus:
  - id: llc-file
    item: "1101"
    name: Start a company
    blurb: We help you set up a limited liability company, also called an LLC. A lawyer checks your papers before we file them with the state.
    flatFee: form
    period: per form
    category: company
    stateFee: true
    includes:
      - Check that your business name is available
      - Prepare the papers to create your company
      - Have a lawyer check and file the papers
    related:
      - llc-launch
      - nv-address
      - annual-report
    keywords:
      - LLC
      - articles of organization
      - formation
      - File
  - id: llc-launch
    item: "1102"
    name: Company setup package
    blurb: Set up your limited liability company and get the ownership agreement and tax ID a bank will usually ask for.
    flatFee: form
    period: per form
    category: company
    stateFee: true
    includes:
      - Set up your limited liability company
      - An agreement between the owners
      - A federal tax ID for your business
    related:
      - nv-address
      - annual-report
      - nda
    keywords:
      - LLC
      - EIN
      - operating agreement
      - formation
      - Launch
  - id: nonprofit
    item: "1103"
    name: Start a nonprofit
    blurb: Set up your nonprofit and apply for federal tax exemption. Government fees are separate.
    flatFee: form
    period: per form
    category: company
    stateFee: true
    includes:
      - Papers to set up the nonprofit and explain how it runs
      - Rules for handling personal interests in nonprofit decisions
      - Prepare and file the application for federal tax exemption
    related:
      - nv-address
    keywords:
      - 501(c)(3)
      - Form 1023
      - bylaws
      - conflict-of-interest policy
  - id: annual-report
    item: "1201"
    name: Renew your Nevada business paperwork
    blurb: We file your company's yearly report and renew its state business license.
    flatFee: form
    period: per form
    category: compliance
    stateFee: true
    includes:
      - Update the state's list of your company's officers or managers
      - Renew your business license
      - Have a lawyer check and file the papers
    related:
      - nv-address
    keywords:
      - annual report
      - annual list
      - licence
      - compliance
  - id: nv-address
    item: "1202"
    name: Nevada business address
    blurb: Get a Nevada street address to receive legal notices and mail. We forward them to you.
    amount: $350
    period: per year
    category: compliance
    stateFee: false
    includes:
      - A street address for legal notices
      - Your mail forwarded to you
    related:
      - annual-report
    keywords:
      - service of process
  - id: trademark
    membersOnly: true
    item: "1301"
    name: Apply for a trademark
    blurb: We check for similar names or logos and file your application for one group of goods or services.
    flatFee: trademark
    period: + government filing fee
    category: identity
    stateFee: true
    includes:
      - Search for similar names or logos
      - One name or logo in one group of goods or services
      - Have a lawyer check and file the application
    keywords:
      - USPTO
      - trademark application
      - clearance search
      - class
  - id: name-change
    item: "1302"
    name: Change your legal name
    blurb: We prepare your request, arrange the required public notice, and attend the hearing. For name changes that no one is challenging.
    flatFee: form
    period: per form, plus court and publication costs
    category: identity
    stateFee: true
    includes:
      - Your request to the court
      - The required public notice
      - A lawyer at your hearing
    keywords:
      - uncontested
      - petition
      - publication
  - id: will
    item: "1401"
    name: Make a will
    blurb: Tell us who you want to leave things to. A lawyer prepares and reviews your will.
    flatFee: form
    period: per form
    category: estate
    stateFee: false
    includes:
      - Questions about your wishes
      - A will prepared and checked by a lawyer
      - Help signing your will with witnesses
    related:
      - estate-package
      - trust
    keywords:
      - simple will
      - estate
  - id: estate-package
    item: "1402"
    name: Plan for your family
    blurb: Make a will and choose who can handle your money and healthcare decisions if you can't.
    flatFee: form
    period: per form
    category: estate
    stateFee: false
    includes:
      - A will
      - A document naming someone to handle your finances
      - Your wishes for medical care and who can make decisions for you
    related:
      - trust
    keywords:
      - estate package
      - financial power of attorney
      - healthcare directive
  - id: trust
    item: "1403"
    name: Set up a living trust
    blurb: Create a trust you can change during your lifetime, plus a will and the paperwork to put one Nevada property into the trust.
    flatFee: form
    period: per form
    category: estate
    stateFee: false
    includes:
      - A living trust you can change
      - A will that leaves property to the trust
      - Paperwork to put one Nevada property into the trust
    related:
      - will
    keywords:
      - revocable living trust
      - pour-over will
      - deed
      - estate
  - id: nda
    membersOnly: true
    item: "1501"
    name: Review a confidentiality agreement
    blurb: We'll read your contract, suggest changes, and explain them. Covers one agreement where both sides promise to keep information private.
    amount: $100
    period: per contract
    category: contracts
    stateFee: false
    includes:
      - Read the whole agreement
      - Show suggested changes
      - Explain what changed and why
    related:
      - consulting
      - send-template
    keywords:
      - mutual NDA
      - non-disclosure
      - confidentiality
      - redline
  - id: consulting
    membersOnly: true
    item: "1502"
    name: Review a freelance or consulting contract
    blurb: We'll read your contract and suggest changes to protect your interests.
    amount: $250
    period: per contract
    category: contracts
    stateFee: false
    includes:
      - Read the whole contract
      - Show suggested changes
      - Check the terms for work as a contractor
    related:
      - employment
      - nda
    keywords:
      - consulting agreement
      - independent-contractor
      - redline
  - id: employment
    membersOnly: true
    item: "1503"
    name: Review a job offer or employment contract
    blurb: We'll check your offer, including any company shares you're offered and limits on where you can work next.
    amount: $350
    period: per contract
    category: contracts
    stateFee: false
    includes:
      - Review your job offer or employment contract
      - Check any offer of company shares
      - Check limits on working for another employer
    related:
      - msa
      - nda
    keywords:
      - employment agreement
      - equity
      - stock options
      - non-compete
  - id: msa
    membersOnly: true
    item: "1504"
    name: Review a business services contract
    blurb: We review the main contract for ongoing work between your business and a customer or supplier.
    amount: $500
    period: per contract
    category: contracts
    stateFee: false
    includes:
      - Read the whole contract
      - Show suggested changes you can share with the other side
    related:
      - consulting
    keywords:
      - MSA
      - master services agreement
      - redline
  - id: form-review
    item: "1505"
    name: Get a legal form
    blurb: Get the form you need. Any work by a lawyer is priced separately.
    flatFee: form
    period: per form
    category: contracts
    stateFee: false
    includes:
      - The form you need
      - A separate price for any work by a lawyer
    related:
      - send-template
    keywords:
      - form review
  - id: send-template
    item: "1506"
    name: Send a contract to be signed
    blurb: Send one of our contracts for someone to sign online, and see when they've signed.
    amount: $5
    period: per send, plus any form fee
    category: contracts
    stateFee: false
    includes:
      - Send the contract to be signed online
      - See whether it has been signed
    related:
      - nda
    keywords:
      - template
      - electronic signature
  - id: demand
    item: "1601"
    name: Send a letter from a lawyer
    blurb: We review what you send us, then write and sign one letter asking the other side to take action. Court work is not included.
    amount: $350
    period: for one letter
    category: urgent
    stateFee: false
    includes:
      - Review the information you send
      - One letter signed by the firm
    keywords:
      - demand letter
      - dispute
  - id: eviction
    item: "1602"
    name: Get help with an eviction
    blurb: For tenants in Nevada's shorter eviction process. We prepare your response to the court and speak for you at one hearing.
    amount: $750
    period: for one hearing
    category: urgent
    stateFee: false
    includes:
      - Your written response to the court
      - A lawyer to speak for you at one hearing
    keywords:
      - tenant eviction defense
      - summary eviction
      - answer
process:
  title: How we help.
  steps:
    - id: need
      title: Tell us what you need
      detail: Choose a plan or a service. If you have a dispute, start with a free consultation.
    - id: scope
      title: Know what happens next
      detail: We'll explain what we can do and what it costs before you decide.
    - id: work
      title: Get help from your lawyer
      detail: We'll ask for the information we need, do the agreed work, and keep you updated.
faq:
  - id: plan-required
    trigger: Do I need a subscription?
    body: You need a plan for custom contract reviews and trademarks. You can ask for other services without one. The first consultation about a dispute is free.
  - id: fees
    trigger: What costs extra?
    body: Work that your plan doesn't include costs extra. We'll tell you the price before we start. Government fees are separate.
  - id: timing
    trigger: What happens when I contact you?
    body: We'll listen, check whether we can help, and explain the next step. Please tell us if you have a deadline.
