faq:
  - id: plan-required
    trigger: Do I need a Fractional GC or Personal Plan?
    body: Not to buy a filing on this page. The live neonlaw.com services page still requires a plan; this specimen is the storefront rewrite — à la carte first, plan as the better value if you will be back.
  - id: state-fees
    trigger: Who sets the state or USPTO fee?
    body: The government body. We pass it through at cost. We cannot control it, and we do not mark it up.
  - id: notation
    trigger: What does “powered by notation” mean?
    body: Your answers are stored as Markdown with YAML front matter — the same format a brief cites. Counsel reviews that source, not a screenshot of a wizard. A later annual report or amendment starts from the same file.
  - id: speed
    trigger: How fast is it, really?
    body: A document from the firm library can go out the same business day. A filing is as fast as the agency. We do not promise a result, and we do not pretend the Secretary of State works on our clock.

disclaimer: Attorney advertising. This page is a design specimen, not an offer to represent you, not a guarantee of a result, and not a substitute for advice on your facts. Engagement starts only after a conflicts check and a signed scope.

