  - icon: handshake
    heading: "{shared:fractional_gc.eyebrow}"
    body: >-
      Contract-library access at {shared:fractional_gc.price} a day, then a la
      carte Notations for the documents you need.
    href: /fractional-gc
  - icon: technology
    heading: "{shared:personal_plan.eyebrow}"
    body: >-
      Help with taxes and personal information, including optional credit
      monitoring.
    href: /personal-plan
