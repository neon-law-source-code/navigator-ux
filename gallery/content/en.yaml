process:
  title: How a filing actually moves
  note: Four steps. The notation is step two.
  steps:
    - id: account
      title: Create an account
      detail: Everything about the matter lives in one place.
    - id: answers
      title: Answer some questions
      detail: A short questionnaire, scoped to the filing. Your answers become a notation — Markdown under YAML that names the source — not a trapped form.
    - id: docs
      title: Upload what we ask for
      detail: We tell you which documents the matter actually needs.
    - id: file
      title: We file it, expeditiously
      detail: A licensed attorney reviews the notation, then we file and send the confirmation when it comes back.

