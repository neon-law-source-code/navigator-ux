subscriptions:
  title: "{shared:services.subscriptions_heading}"
  intro: Choose a plan for ongoing help with your business or personal legal needs. Individual services are also available when you need help with one thing.
  forms: >-
    Business-plan access is {shared:fractional_gc.price} a day, and Personal-plan
    access is {shared:personal_plan.price} a day. Each plan has its own minimum
    retainer. Notation packages show an a la carte price and a lower plan price.
    Every plan price shown is at least half off the a la carte price. Government
    fees are separate.
  reviews: >-
    Each Notation has an agreed scope and price before work begins. Plan access
    and its daily charge are separate from the package price.
  cta: See the plan
  join: Ask about access
  member_cta: Already have a plan? Email us to get started
  member_title: Choose a plan to get started.
  member_intro: This service requires a plan. The service fee is separate from your plan's price.
  interest: What you need help with
